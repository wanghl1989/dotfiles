
set -ogq @thm_bg "#16181a"
set -ogq @thm_fg "#ffffff"

# Colors
set -ogq @thm_rosewater "#ff5ea0"
set -ogq @thm_flamingo "#ff5ea0"
set -ogq @thm_pink "#ff5ea0"
set -ogq @thm_mauve "#ff5ef1"
set -ogq @thm_red "#ff6e5e"
set -ogq @thm_maroon "#ffbd5e"
set -ogq @thm_peach "#ffbd5e"
set -ogq @thm_yellow "#f1ff5e"
set -ogq @thm_green "#5eff6c"
set -ogq @thm_teal "#5ef1ff"
set -ogq @thm_sky "#5ef1ff"
set -ogq @thm_sapphire "#5ef1ff"
set -ogq @thm_blue "#5ea1ff"
set -ogq @thm_lavender "#bd5eff"

# Surfaces and overlays
set -ogq @thm_subtext_1 "#7b8496"
set -ogq @thm_subtext_0 "#7b8496"
set -ogq @thm_overlay_2 "#3c4048"
set -ogq @thm_overlay_1 "#3c4048"
set -ogq @thm_overlay_0 "#3c4048"
set -ogq @thm_surface_2 "#1e2124"
set -ogq @thm_surface_1 "#1e2124"
set -ogq @thm_surface_0 "#1e2124"
set -ogq @thm_mantle "#1e2124"
set -ogq @thm_crust "#1e2124"
#
# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour136,bg=colour235

# message text
set-option -g message-style bg=colour235,fg=colour166

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# vim: ft=tmux
set -g mode-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g message-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g message-command-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g pane-border-style "fg=#{@thm_bg}"
set -g pane-active-border-style "fg=#{@thm_blue}"

set -g status "on"
set -g status-interval 1
set -g status-position 'top'
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=#{@thm_bg}"

set -g status-bg "#16181a"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#{@thm_bg},bg=#{@thm_rosewater},bold] #S.#I:#P  #[fg=#{@thm_rosewater},bg=#{@thm_blue},nobold,nounderscore,noitalics]#[fg=#15161E,bg=#{@thm_blue},bold]  #(whoami) #[fg=#{@thm_blue},bg=#{@thm_bg}]"
set -g status-right "#[fg=#586e75,bg=#{@thm_bg},nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#{@thm_peach},bg=#657b83]#[fg=#{@thm_crust},bg=#{@thm_peach},nobold,nounderscore,noitalics]  #{pane_current_path}#[fg=#93a1a1,bg=#657b83]#[fg=#{@thm_red},bg=#{@thm_peach},nobold,nounderscore,noitalics]#[fg=#{@thm_crust},bg=#{@thm_red},bold]  #h "

setw -g window-status-activity-style "underscore,fg=#839496,bg=#{@thm_bg}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=#{@thm_bg}"
setw -g window-status-format '#[fg=#{@thm_bg},bg=#{@thm_bg}]#[default] #I  #W #[fg=#{@thm_bg},bg=#{@thm_bg},nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#{@thm_bg},bg=#{@thm_green}]#[fg=#{@thm_crust},bg=#{@thm_green}] #I #[fg=#{@thm_green},bg=#{@thm_yellow}] #[fg=#{@thm_crust},bg=#{@thm_yellow}]#W #[fg=#{@thm_yellow},bg=#{@thm_bg},nobold]'
