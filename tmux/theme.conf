set -ogq @thm_bg "#0B0C16"
set -ogq @thm_fg "#ddf7ff"

# Colors
set -ogq @thm_black "#000000"
set -ogq @thm_red "#50f872"
set -ogq @thm_green "#4fe88f"
set -ogq @thm_yellow "#50f7d4"
set -ogq @thm_blue "#829dd4"
set -ogq @thm_magenta "#86a7df"
set -ogq @thm_cyan "#7cf8f7"
set -ogq @thm_white "#85E1FB"


# default statusbar colors
set-option -g status-style bg=#0B0C16,fg=#ddf7ff,default

# default window title colors
set-window-option -g window-status-style fg=#ddf7ff,bg=#0B0C16,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=#4fe88f #base02
set-option -g pane-active-border-style fg=#4fe88f,bg=#0B0C16

# message text
set-option -g message-style bg=#0B0C16,fg=#4fe88f

# pane number display
set-option -g display-panes-active-colour "#50f872"
set-option -g display-panes-colour "#ddf7ff"

# clock
set-window-option -g clock-mode-colour "#50f872"

# status line
set -g mode-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g message-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g message-command-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g pane-border-style "fg=#{@thm_fg}"
set -g pane-active-border-style "fg=#{@thm_green}"


set -g status "on"
set -g status-interval 1
set -g status-position 'top'
set -g status-justify "left"

set -g status-style "fg=#85E1FB,bg=#0B0C16"

set -g status-bg "#0B0C12"


set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#{@thm_cyan},bg=#{@thm_black},bold]   #(whoami)(#S) \[#I:#P\]   "
set -g status-right "#[fg=#{@thm_fg},bg=#0B0C12,nobold,nounderscore,noitalics]  #{pane_current_path}  #[fg=#{@thm_bg},bg=#{@thm_fg}]#[fg=#{@thm_bg},bg=#{@thm_fg},bold]  #h #[fg=#{@thm_fg},bg=#0B0C12] "

setw -g window-status-activity-style "underscore,fg=#{@thm_green},bg=#{@thm_bg}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#{@thm_green},bg=#{@thm_bg}"
setw -g window-status-format '#[fg=#0B0C12,bg=#{@thm_fg}]#[bold] #W 󰐣#I #[fg=#{@thm_fg},bg=#0B0C12,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#{@thm_bg},bg=#{@thm_green}]#[fg=#{@thm_crust},bg=#{@thm_green},bold] #W 󰐣#I #[fg=#{@thm_green},bg=#0B0C12,nobold]'
