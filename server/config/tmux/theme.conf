set -ogq @thm_bg "#1d2021"
set -ogq @thm_fg "#d4be98"
set -ogq @thm_bg1 "#282828"
# Colors
set -ogq @thm_black "#665c54"
set -ogq @thm_red "#ea6962"
set -ogq @thm_green "#a9b665"
set -ogq @thm_yellow "#e78a4e"
set -ogq @thm_blue "#7daea3"
set -ogq @thm_magenta "#d3869b"
set -ogq @thm_cyan "#89b482"
set -ogq @thm_white "#d4be98"




set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# default statusbar colors
set-option -g status-style bg=#1d2021,fg=#d4be98,default

# default window title colors
set-window-option -g window-status-style fg=#d4be98,bg=#1d2021,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set -g pane-border-lines heavy
set -g pane-border-style "fg=#{@thm_black}",dim
set -g pane-active-border-style "fg=#{@thm_green}",bold


# message text
set-option -g message-style bg=#282828,fg=#a9b665

# pane number display
set-option -g display-panes-active-colour "#a9b665"
set-option -g display-panes-colour "#d4be98"

# clock
set-window-option -g clock-mode-colour "#a9b665"

# status line
set -g mode-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g message-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g message-command-style "fg=#{@thm_blue},bg=#{@thm_bg}"


set -g status "on"
set -g status-interval 1
set -g status-position 'top'
set -g status-justify "left"

set -g status-style "fg=#d4be98,bg=#282828"

set -g status-bg "#282828"


set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#{@thm_bg1},bg=#{@thm_cyan},bold]▓▒░  #(whoami)(#S) \[#I:#P\] #[fg=#{@thm_cyan},bg=#{@thm_bg1},bold]"
set -g status-right "#[fg=#{@thm_bg},bg=#{@thm_dark}]  #h "

setw -g window-status-activity-style "underscore,fg=#{@thm_green},bg=#{@thm_bg1}"
setw -g window-status-separator "\ueb10"
setw -g window-status-style "NONE,fg=#{@thm_black},bg=#{@thm_bg1}"
setw -g window-status-format '#[fg=#{@thm_black},bg=#{@thm_bg1}] #[fg=#{@thm_black},bg=#{@thm_bg1},bold] #I:#W '
setw -g window-status-current-format '#[fg=#{@thm_green},bg=#{@thm_bg1}] #[fg=#{@thm_green},bg=#{@thm_bg1},bold] #I:#W '



# 搜索匹配项样式（可选）
set -g copy-mode-match-style fg='#282828',bg='#7daea3'
set -g copy-mode-current-match-style fg='#282828',bg='#e78a4e'
