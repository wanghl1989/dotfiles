# Neofusion
# Adapted from https://github.com/diegoulloao/neofusion.nvim

set -gq @thm_bg "#070F1C"
set -gq @thm_fg "#E0D9C7"
set -gq @thm_bg1 "#031B26"
set -gq @thm_black "#2F516C"
set -gq @thm_red "#EA6847"
set -gq @thm_green "#35B5FF"
set -gq @thm_yellow "#FD5E3A"
set -gq @thm_orange "#FA7A61"
set -gq @thm_blue "#5DB2F8"
set -gq @thm_magenta "#D943A8"
set -gq @thm_cyan "#86DBF5"
set -gq @thm_white "#E0D9C7"
set -gq @thm_dark "#22536F"
set -gq @thm_border "#06364B"

set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

set-option -g status-style "bg=#{@thm_bg1},fg=#{@thm_fg},default"
set-window-option -g window-status-style "fg=#{@thm_fg},bg=#{@thm_bg},dim"
set-window-option -g window-status-current-style "fg=#{@thm_orange},bg=default,bright"

set -g pane-border-lines heavy
set -g pane-border-style "fg=#{@thm_border},dim"
set -g pane-active-border-style "fg=#{@thm_green},bold"

set-option -gF display-panes-active-colour "#{@thm_green}"
set-option -gF display-panes-colour "#{@thm_fg}"
set-window-option -gF clock-mode-colour "#{@thm_green}"

set -g mode-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -g message-style "fg=#{@thm_blue},bg=#{@thm_bg1}"
set -g message-command-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g status "on"
set -g status-interval 1
set -g status-position "top"
set -g status-justify "left"
set -gF status-bg "#{@thm_bg1}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#{@thm_bg1},bg=#{@thm_cyan},bold]  #(whoami)(#S) \[#I:#P\] #[fg=#{@thm_cyan},bg=#{@thm_bg1},bold]"
set -g status-right "#[fg=#{@thm_bg},bg=#{@thm_dark}]  #h "

setw -g window-status-activity-style "underscore,fg=#{@thm_green},bg=#{@thm_bg1}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#{@thm_black},bg=#{@thm_bg1}"
setw -g window-status-format "#[fg=#{@thm_black},bg=#{@thm_bg1}] #[fg=#{@thm_black},bg=#{@thm_bg1},bold] #I:#W "
setw -g window-status-current-format "#[fg=#{@thm_green},bg=#{@thm_bg1}] #[fg=#{@thm_green},bg=#{@thm_bg1},bold] #I:#W "

set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_green}"
set -g copy-mode-selection-style "fg=#{@thm_bg1},bg=#{@thm_green}"
set -g copy-mode-match-style "fg=#{@thm_bg1},bg=#{@thm_blue}"
set -g copy-mode-current-match-style "fg=#{@thm_bg1},bg=#{@thm_orange}"
