[colors.primary]
background = "#0B0C16"
foreground = "#d4be98"
dim_foreground = "#d4be98"
bright_foreground = "#d4be98"

[colors.cursor]
text = "#0B0C16"
cursor = "#F5E0DC"

[colors.vi_mode_cursor]
text = "#0B0C16"
cursor = "#86a7df"
[colors.search.matches]
foreground = "#1E1E2E"
background = "#6a6e95"

[colors.search.focused_match]
foreground = "#1E1E2E"
background = "#a9b665"

[colors.footer_bar]
foreground = "#1E1E2E"
background = "#6a6e95"

[colors.hints.start]
foreground = "#1E1E2E"
background = "#e78a4e"

[colors.hints.end]
foreground = "#1E1E2E"
background = "#6a6e95"

[colors.selection]
text = "#0B0C16"
background = "#F5E0DC"

[colors.normal]
black = "#0B0C16"
red = "#ea6962"
green = "#a9b665"
yellow = "#e78a4e"
blue = "#5ea1ff"
magenta = "#86a7df"
cyan = "#89b482"
white = "#FF79C6"

[colors.bright]
black = "#585B70"
red = "#ea6962"
green = "#a9b665"
yellow = "#e78a4e"
blue = "#5ea1ff"
magenta = "#86a7df"
cyan = "#89b482"
white = "#FF79C6"

[colors.dim]
black = "#0B0C16"
red = "#ea6962"
green = "#a9b665"
yellow = "#e78a4e"
blue = "#5ea1ff"
magenta = "#86a7df"
cyan = "#89b482"
white = "#FF79C6"

[[colors.indexed_colors]]
index = 16
color = "#d11500"

[[colors.indexed_colors]]
index = 17
color = "#f40064"

[colors]

draw_bold_text_with_bright_colors = true

[font]

normal = { family = "IosevkaTermSlab Nerd Font Mono", style = "Regular" }
size = 14

[window]
decorations = "None"
dynamic_padding = true
padding = { x = 10, y = 10 }
dimensions = { columns = 138, lines = 37 }
position = { x = 0, y = 0 }
opacity = 0.85
blur = true

[scrolling]

history = 50000

[selection]

save_to_clipboard = true

[keyboard]

bindings = [

  { key = "n", mods = "Control | Shift", action = "CreateNewWindow" },
  { key = "1", mods = "Control | Shift", action = "SelectTab1" },
  { key = "2", mods = "Control | Shift", action = "SelectTab2" },
  { key = "3", mods = "Control | Shift", action = "SelectTab3" },
  { key = "4", mods = "Control | Shift", action = "SelectTab4" },
  { key = "5", mods = "Control | Shift", action = "SelectTab5" },
  { key = "6", mods = "Control | Shift", action = "SelectTab6" },
  { key = "7", mods = "Control | Shift", action = "SelectTab7" },
  { key = "8", mods = "Control | Shift", action = "SelectTab8" },
  { key = "9", mods = "Control | Shift", action = "SelectTab9" },

]
