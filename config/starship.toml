"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ┌─](bold #50f872)\
$os\
$directory\
$git_branch\
$git_status\
$git_commit\n\
[ └─](bold #50f872)\
$character\
"""

right_format = """
$cmd_duration\
$package\
$c\
$cpp\
$rust\
${custom.cargo_version}\
$golang\
$nodejs\
$python\
$conda\
$docker_context\n\
$time\
${custom.emoji}\
"""

[username]
disabled = true
format = '[$user]($style) '
show_always = false

[bun]
symbol = " "

[c]
symbol = " "
style = "bold fg:#ff6e5e"
format = '[$symbol($version(-$name) )]($style)'

[cpp]
symbol = " "
style = "bold fg:#ff6e5e"
format = '[$symbol($version(-$name) )]($style)'


[cmake]
symbol = " "
format = '[$symbol($version )]($style)'

[conda]
symbol = " "
format = '[$symbol$environment]($style) '


[deno]
symbol = " "

[directory]
# read_only = "[󰌾]"
# home_symbol = ""
# truncation_length = 3
# truncation_symbol = ""
style = "bold fg:#7cf8f7"
format = " [ $path]($style) "

[docker_context]
symbol = " "
style = "bold fg:#f1ff5e"
format = '[$symbol$context]($style) '


[custom.zvm]
symbol = " "
command = "echo $ZVM_MODE"
style = "bold fg:#ff5ef1"
format = '[$symbol ($output)]($style) '

[git_branch]
symbol = " "
style = "bold fg:#ff5ef1"
format = '[$symbol$branch(:$remote_branch)]($style) '
# format = '[ $symbol $branch]($style)'

[git_status]
style = "bold fg:#ff5ef1"
format = '[\[($all_status$ahead_behind)\]]($style)'

[git_commit]
style = "bold fg:#ff5ef1"
tag_symbol = '  '

[golang]
symbol = " "
style = "bold fg:#7cf8f7"
format = '[$symbol($version )]($style)'

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "


[nix_shell]
symbol = " "

[nodejs]
symbol = " "
style = "bold fg:#829dd4"
format = '[$symbol($version )]($style)'


[os]
disabled = false
style = "fg:#50f872"
format = '[ $symbol ]($style)'

[os.symbols]
Alpaquita = ""
Alpine = ""
AlmaLinux = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = "󰈺"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
Redox = "󰀘"
Solus = "󰠳 "
SUSE = ""
Ubuntu = ""
Unknown = ""
Void = ""
Windows = "󰍲"

[package]
symbol = "󰏗 "
style = "bold fg:#f1ff5e"
format = '[$symbol$version]($style) '


[python]
symbol = " "
style = 'bold fg:#50f872'
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "
style = "bold fg:#ffbd5e"
format = '[$symbol($version )]($style)'


[character]
disabled = false
format = '$symbol '
# success_symbol = '[](bold green) '
# error_symbol = '[](bold red) '
# vimcmd_symbol = '[](bold green)'
# vimcmd_replace_one_symbol = '[](bold purple)'
# vimcmd_replace_symbol = '[](bold purple)'
# vimcmd_visual_symbol = '[](bold yellow)'
#
#
#
[time]
disabled = false
style = "bold fg:#829dd4"
format = '[ $time ]($style) '
time_format = "%H:%M"

[cmd_duration]
show_milliseconds = true
format = "[󰗕 in $duration ]($style)"
style = "fg:#ddf7ff"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[custom.cargo_version]
command = 'cat Cargo.toml|grep version|head -1|cut -f2 -d\"'
detect_extensions = ['rs']
detect_files = ['Cargo.toml']
style = "bold fg:#ffbd5e"

[custom.emoji]
description = "Displays a (pseudo) random emoji for each prompt"
# change the content of the EMOJIS array to your liking and replace the
# number 12 with the number of items in the array, minus one
command = "EMOJIS=(⛵️ 🛰 🪐 🚀 🧡 🔭 🌍 💫 ☄️ ✨ 🌠 🌌 ⭐️); EMOJI_INDEX=$(( $RANDOM % 12 + 0 )); echo ${EMOJIS[$EMOJI_INDEX]}"
# if you are on windows, replace "true" with "1"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = " $output "
